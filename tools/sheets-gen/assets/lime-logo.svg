<!--
  Lime Premium Studios — leaf logo for Budget Tracker deliverables.
  Recreated to match the Lime brand mark in kareemhady/src/app/_components/brand.tsx:
    • Rounded-square container (22% radius), 135° gradient #84CC16 → #059669
       (Tailwind: lime-500 → emerald-600)
    • White Lucide-style "Leaf" glyph centered, 2.4-stroke
  Used as inline SVG in PDFs and rasterized to PNG for .xlsx via render-logo.js.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lime Premium Studios">
  <defs>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#limeGrad)"/>
  <g transform="translate(12,12) scale(1.667)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c1.4 2.04 2.04 3.96 1.84 5.96-.2 1.96-1.04 4.04-2.16 5.96"/>
    <path d="M2 21c0-3 1.85-5.36 5.08-6"/>
  </g>
</svg>
