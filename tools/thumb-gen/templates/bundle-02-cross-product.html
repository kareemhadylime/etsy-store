<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bundle Thumbnail 02 — Cross-Product Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-charcoal: #1F2A33; --secondary-warm-gold: #C9A14A;
    --background-off-white: #F7F5F0; --surface-white: #FFFFFF;
    --status-success: #3F6B4D; --status-alert: #9B3A30;
    --neutral-grid: #D8DCDF; --ivory: #FAF7F0;
    --wedding-rose: #C9A0A0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 2000px; height: 2000px; font-family: 'Inter', -apple-system, sans-serif; background: var(--background-off-white); color: var(--primary-charcoal); position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }

  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 140px; background: var(--primary-charcoal); color: var(--surface-white); display: flex; align-items: center; justify-content: space-between; padding: 0 100px; }
  .wordmark { font-size: 28px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .tag-pill { background: var(--secondary-warm-gold); color: var(--primary-charcoal); padding: 12px 32px; border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }

  .title-block { position: absolute; top: 220px; left: 100px; right: 100px; text-align: center; }
  .title-eyebrow { font-size: 30px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--secondary-warm-gold); margin-bottom: 22px; }
  .title-main { font-size: 160px; font-weight: 700; line-height: 0.96; letter-spacing: -0.025em; }
  .gold-bar { width: 280px; height: 10px; background: var(--secondary-warm-gold); margin: 30px auto; }
  .title-sub { font-size: 38px; font-weight: 500; opacity: 0.78; line-height: 1.35; max-width: 1500px; margin: 0 auto; }

  .diagram {
    position: absolute; top: 720px; left: 120px; right: 120px; bottom: 280px;
    background: var(--surface-white); border-radius: 24px;
    border: 1px solid var(--neutral-grid);
    padding: 60px;
    box-shadow: 0 30px 60px rgba(31,42,51,0.10);
  }
  .node {
    position: absolute;
    width: 260px;
    padding: 24px 18px;
    background: var(--surface-white);
    border: 4px solid var(--primary-charcoal);
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 8px 18px rgba(31,42,51,0.12);
  }
  .node.foundation { border-color: var(--secondary-warm-gold); background: var(--ivory); }
  .node.wedding { border-color: var(--wedding-rose); background: #FAF3F3; }
  .node-emoji { font-size: 50px; margin-bottom: 8px; }
  .node-name { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .node-sub { font-size: 13px; opacity: 0.65; margin-top: 4px; letter-spacing: 0.10em; text-transform: uppercase; }

  /* Layout */
  .node.budget   { top: 40px;  left: 40px; }
  .node.sinking  { top: 40px;  left: 50%; transform: translateX(-50%); }
  .node.wedding  { top: 40px;  right: 40px; }
  .node.nw       { top: 320px; left: 50%; transform: translateX(-50%); }
  .node.debt     { top: 600px; left: 40px; }
  .node.smallbiz { top: 600px; right: 40px; }

  .bottom-band { position: absolute; bottom: 0; left: 0; right: 0; height: 220px; background: var(--primary-charcoal); color: var(--surface-white); display: flex; align-items: center; justify-content: center; padding: 0 100px; gap: 60px; }
  .b-stat { text-align: center; }
  .b-stat .num { font-size: 80px; font-weight: 800; color: var(--secondary-warm-gold); letter-spacing: -0.03em; line-height: 1; }
  .b-stat .lbl { font-size: 22px; font-weight: 600; opacity: 0.85; margin-top: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .b-divider { width: 4px; height: 100px; background: rgba(255,255,255,0.18); }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">Lime Premium Studios</div>
  <div class="tag-pill">Built to Work Together</div>
</div>

<div class="title-block">
  <div class="title-eyebrow">5 or 6 Spreadsheets · One Data Flow</div>
  <div class="title-main">Built to Work<br>Together.</div>
  <div class="gold-bar"></div>
</div>

<div class="diagram">
  <div class="node foundation budget"><div class="node-emoji">📊</div><div class="node-name">Budget Tracker</div><div class="node-sub">Foundation</div></div>
  <div class="node sinking"><div class="node-emoji">🪣</div><div class="node-name">Sinking Funds</div><div class="node-sub">Goals</div></div>
  <div class="node wedding"><div class="node-emoji">💍</div><div class="node-name">Wedding</div><div class="node-sub">Life Bundle</div></div>
  <div class="node foundation nw"><div class="node-emoji">💰</div><div class="node-name">Net Worth</div><div class="node-sub">Wealth hub</div></div>
  <div class="node debt"><div class="node-emoji">📉</div><div class="node-name">Debt Payoff</div><div class="node-sub">Liabilities</div></div>
  <div class="node smallbiz"><div class="node-emoji">🏢</div><div class="node-name">Small Business</div><div class="node-sub">Side income</div></div>

  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1640 940" preserveAspectRatio="none">
    <defs>
      <marker id="ar" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
        <polygon points="0 0, 14 7, 0 14" fill="#C9A14A"/>
      </marker>
      <marker id="ar-rose" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
        <polygon points="0 0, 14 7, 0 14" fill="#C9A0A0"/>
      </marker>
    </defs>

    <!-- Budget → Sinking -->
    <path d="M 300,120 L 730,120" stroke="#C9A14A" stroke-width="6" fill="none" marker-end="url(#ar)"/>
    <!-- Sinking → Wedding -->
    <path d="M 940,120 L 1340,120" stroke="#C9A0A0" stroke-width="6" fill="none" marker-end="url(#ar-rose)"/>
    <!-- Budget → NW (down) -->
    <path d="M 170,200 Q 200,300 730,400" stroke="#C9A14A" stroke-width="6" fill="none" marker-end="url(#ar)"/>
    <!-- Sinking → NW -->
    <path d="M 830,200 L 830,400" stroke="#C9A14A" stroke-width="6" fill="none" marker-end="url(#ar)"/>
    <!-- Wedding → NW -->
    <path d="M 1470,200 Q 1450,300 940,400" stroke="#C9A0A0" stroke-width="6" fill="none" marker-end="url(#ar-rose)"/>
    <!-- NW ↔ Debt -->
    <path d="M 730,520 Q 500,580 300,680" stroke="#C9A14A" stroke-width="6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <!-- NW ↔ SmallBiz -->
    <path d="M 940,520 Q 1170,580 1340,680" stroke="#C9A14A" stroke-width="6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  </svg>
</div>

<div class="bottom-band">
  <div class="b-stat"><div class="num">6</div><div class="lbl">Spreadsheets</div></div>
  <div class="b-divider"></div>
  <div class="b-stat"><div class="num">10</div><div class="lbl">Workflows</div></div>
  <div class="b-divider"></div>
  <div class="b-stat"><div class="num">1</div><div class="lbl">Data Flow</div></div>
</div>

</body>
</html>
