<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notion Budget OS — Recurring Bills banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1500px; height: 600px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #1F2A33 0%, #2A3A45 45%, #8C7235 80%, #C9A14A 100%);
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 80px);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(31,42,51,0.30) 100%);
    pointer-events: none;
  }
  .glyph {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px;
    opacity: 0.30;
  }
  .glyph svg { width: 100%; height: 100%; stroke: #FFFFFF; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .studio {
    position: absolute;
    bottom: 24px; right: 36px;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.20em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glyph">
    <!-- 🔁 circular arrows -->
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <!-- top arc (open on right) -->
      <path d="M 28 38 A 26 26 0 0 1 78 38" />
      <!-- top arrow head pointing right -->
      <polyline points="68,32 78,38 72,48" fill="none" />
      <!-- bottom arc (open on left) -->
      <path d="M 72 62 A 26 26 0 0 1 22 62" />
      <!-- bottom arrow head pointing left -->
      <polyline points="32,68 22,62 28,52" fill="none" />
    </svg>
  </div>
  <div class="studio">Lime Premium Studios</div>
</body>
</html>
